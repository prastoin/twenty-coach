name: CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  TWENTY_DEPLOY_URL: http://localhost:2020

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

# The upstream deploy/install actions expect .nvmrc and yarn.lock inside
# app-path, which doesn't hold in a yarn-workspaces layout — so their steps
# are inlined here against the repo root, plus the PWA build that must land
# in packages/twenty-app/public/pwa before the app is published.
jobs:
  deploy-and-install:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build trainee PWA
        run: yarn pwa:build

      - name: Configure remote
        run: |
          mkdir -p ~/.twenty
          node -e "
            const fs = require('fs'), path = require('path'), os = require('os');
            fs.writeFileSync(path.join(os.homedir(), '.twenty', 'config.json'), JSON.stringify({
              version: 1,
              remotes: { target: { apiUrl: process.env.API_URL, apiKey: process.env.API_KEY, accessToken: process.env.API_KEY } }
            }, null, 2));
          "
        env:
          API_URL: ${{ env.TWENTY_DEPLOY_URL }}
          API_KEY: ${{ secrets.TWENTY_DEPLOY_API_KEY }}

      - name: Deploy
        run: yarn twenty app:publish --private --remote target

      - name: Install
        run: yarn twenty app:install --remote target
